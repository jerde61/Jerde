<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JERDE // S-RANK EDGERUNNER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --yellow: #fcee0a;
            --cyan: #00f0ff;
            --magenta: #ff003c;
            --bg: #000;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            background: var(--bg);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
        }

        /* --- ARKA PLAN VE TARAMA SATIRLARI --- */
        .cyber-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)),
                        url('https://wallpapercave.com/wp/wp11411516.jpg'); /* Edgerunners Ana Görsel */
            background-size: cover; background-position: center;
            z-index: -2;
            transition: transform 0.1s;
        }

        /* CRT Ekran Efekti */
        .scanlines {
            position: fixed; inset: 0;
            background: linear-gradient(to bottom, rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            z-index: -1; pointer-events: none;
        }

        /* --- BAŞLATMA EKRANI --- */
        #os-boot {
            position: fixed; inset: 0; background: #000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; cursor: crosshair;
        }

        .boot-text {
            color: var(--yellow); font-family: 'Orbitron'; font-size: 1.2rem;
            margin-bottom: 30px; letter-spacing: 5px; animation: blink 0.8s infinite;
        }

        .init-button {
            background: transparent; color: var(--cyan); border: 2px solid var(--cyan);
            padding: 20px 50px; font-family: 'Orbitron'; font-weight: 900;
            font-size: 1.5rem; cursor: pointer; position: relative;
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
            transition: 0.3s;
        }

        .init-button:hover { background: var(--cyan); color: #000; box-shadow: 0 0 30px var(--cyan); }

        /* --- ANA İÇERİK --- */
        .interface {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100vh; opacity: 0; transform: scale(1.1);
            transition: opacity 1s, transform 1s;
        }

        .hero-name {
            font-family: 'Orbitron', sans-serif; font-size: 7rem; font-weight: 900;
            text-transform: uppercase; margin: 0; position: relative;
            color: white; text-shadow: 4px 4px var(--magenta), -4px -4px var(--cyan);
        }

        /* Glitch Yazı Animasyonu */
        .glitch-text::before, .glitch-text::after {
            content: "JERDE"; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        }
        .glitch-text:hover::before { animation: glitch-1 0.4s infinite; color: var(--magenta); z-index: -1; }
        .glitch-text:hover::after { animation: glitch-2 0.4s infinite; color: var(--cyan); z-index: -2; }

        .nav-links { display: flex; gap: 20px; margin-top: 50px; }
        
        .nav-item {
            text-decoration: none; color: var(--yellow); border: 1px solid var(--yellow);
            padding: 15px 30px; font-family: 'Orbitron'; font-size: 0.9rem;
            background: rgba(252, 238, 10, 0.05); transition: 0.3s;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 15% 100%, 0 75%);
        }

        .nav-item:hover { background: var(--yellow); color: #000; box-shadow: 0 0 20px var(--yellow); }

        /* --- ANIMASYONLAR --- */
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        @keyframes glitch-1 { 
            0% { transform: translate(4px, -4px); } 
            50% { transform: translate(-4px, 4px); } 
            100% { transform: translate(0); }
        }
        @keyframes glitch-2 { 
            0% { transform: translate(-4px, 4px); } 
            50% { transform: translate(4px, -4px); } 
            100% { transform: translate(0); }
        }

        /* KRİTİK HATA (Glitch Shake) */
        .system-crash {
            animation: shake 0.15s infinite;
            filter: hue-rotate(270deg) contrast(3);
        }

        @keyframes shake {
            0% { transform: translate(5px, 5px); }
            50% { transform: translate(-5px, -5px); }
            100% { transform: translate(2px, -2px); }
        }
    </style>
</head>
<body>

    <!-- Tarama Satırları Efekti -->
    <div class="scanlines"></div>

    <!-- Başlatma Ekranı -->
    <div id="os-boot">
        <div class="boot-text">NEURAL LINK DISCONNECTED...</div>
        <button class="init-button" onclick="connectLink()">SYNC NEURAL LINK</button>
    </div>

    <div class="cyber-bg" id="bg-layer"></div>

    <div class="interface" id="main-ui">
        <div style="color: var(--magenta); letter-spacing: 12px; font-weight: 900;">[ STATUS: WANTED ]</div>
        <h1 class="hero-name glitch-text">JERDE</h1>
        <div style="color: var(--cyan); letter-spacing: 4px;">EDGERUNNER // NIGHT CITY VETERAN</div>

        <div class="nav-links">
            <a href="#" class="nav-item">DISCORD</a>
            <a href="#" class="nav-item">INSTAGRAM</a>
            <a href="#" class="nav-item">SPOTIFY</a>
        </div>
    </div>

    <!-- Müzik -->
    <audio id="cyber-audio" loop>
        <source src="https://files.catbox.moe/kgu2id.mp3" type="audio/mpeg">
    </audio>

    <script>
        function connectLink() {
            const audio = document.getElementById('cyber-audio');
            const boot = document.getElementById('os-boot');
            const ui = document.getElementById('main-ui');

            // Ses Çalma (En yüksek ihtimalli yöntem)
            audio.volume = 0.5;
            audio.play().then(() => {
                console.log("Audio playing");
            }).catch(e => {
                console.log("Audio failed. Possible CORS or Link issue.");
            });

            boot.style.display = 'none';
            ui.style.opacity = '1';
            ui.style.transform = 'scale(1)';

            // Glitch Döngüsü
            setInterval(() => {
                if(Math.random() > 0.94) {
                    document.body.classList.add('system-crash');
                    setTimeout(() => {
                        document.body.classList.remove('system-crash');
                    }, 150 + Math.random() * 200);
                }
            }, 200);
        }
    </script>
</body>
</html>
