<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JERDE // CYBERPUNK</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --cp-yellow: #FCEE0A; --cp-cyan: #00f0ff; --cp-pink: #ff003c; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Rajdhani', sans-serif; background-color: #000; color: white; overflow: hidden; }
        
        /* Arka Plan */
        .bg-video {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), 
                        url('https://wallpaperaccess.com/full/8251210.jpg') no-repeat center center;
            background-size: cover; z-index: -1;
        }

        /* Glitch Efekti */
        .glitch-active { animation: glitch-anim 0.2s infinite; filter: hue-rotate(90deg) contrast(1.5); }
        @keyframes glitch-anim {
            0% { transform: translate(2px, -2px); }
            50% { transform: translate(-2px, 2px); opacity: 0.8; }
            100% { transform: translate(0); }
        }

        /* Başlatma Ekranı */
        #boot-screen {
            position: fixed; inset: 0; background: #000; z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .boot-btn {
            background: var(--cp-yellow); color: #000; border: none; padding: 20px 40px;
            font-family: 'Orbitron', sans-serif; font-weight: 900; cursor: pointer;
            clip-path: polygon(0 0, 100% 0, 100% 70%, 85% 100%, 0 100%);
            box-shadow: 5px 5px 0 var(--cp-cyan);
        }

        /* İçerik */
        .content { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; text-align: center; opacity: 0; transition: 1s ease-in;
        }
        .main-name { 
            font-family: 'Orbitron', sans-serif; font-size: 6rem; margin: 0;
            text-shadow: 4px 4px var(--cp-cyan), -4px -4px var(--cp-pink);
        }
        .btn-group { display: flex; gap: 15px; margin-top: 30px; }
        .social-btn {
            text-decoration: none; color: var(--cp-cyan); border: 1px solid var(--cp-cyan);
            padding: 10px 25px; font-weight: 700; transition: 0.3s;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
        }
        .social-btn:hover { background: var(--cp-cyan); color: #000; box-shadow: 0 0 15px var(--cp-cyan); }
    </style>
</head>
<body>

    <div id="boot-screen">
        <button class="boot-btn" onclick="initializeSystem()">BOOT UP SYSTEM</button>
    </div>

    <div class="bg-video"></div>

    <div class="content" id="main-ui">
        <div style="color: var(--cp-yellow); letter-spacing: 10px;">LEGEND DETECTED</div>
        <h1 class="main-name">JERDE</h1>
        <div class="btn-group">
            <a href="#" class="social-btn">DISCORD</a>
            <a href="#" class="social-btn">INSTAGRAM</a>
            <a href="#" class="social-btn">SPOTIFY</a>
        </div>
    </div>

    <!-- Müzik dosyası (Catbox gibi güvenilir bir link) -->
    <audio id="cyber-audio" loop>
        <source src="https://files.catbox.moe/kgu2id.mp3" type="audio/mpeg">
    </audio>

    <script>
        function initializeSystem() {
            const audio = document.getElementById('cyber-audio');
            audio.play().catch(err => console.log("Müzik engellendi"));
            
            document.getElementById('boot-screen').style.display = 'none';
            document.getElementById('main-ui').style.opacity = '1';

            setInterval(() => {
                if(Math.random() > 0.96) {
                    document.body.classList.add('glitch-active');
                    setTimeout(() => document.body.classList.remove('glitch-active'), 150);
                }
            }, 100);
        }
    </script>
</body>
</html>
